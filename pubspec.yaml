# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: eppy_island
description: a serious and competitive game.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^3.0.0
  flame: ^1.38.2
  flame_tiled: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  assets:
    - assets/images/

    - assets/images/tilesets/
    - assets/images/tilesets/Hills.png
    - assets/images/tilesets/Water.png
    - assets/images/characters/
    - assets/images/characters/Teemo/

    - assets/tiles/
    - assets/tiles/Level-01.tmx
    - assets/tiles/Hills.tsx
    - assets/tiles/Water.tsx
